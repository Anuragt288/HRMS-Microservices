spring.application.name=gateway-service
server.port=8080

# =========================================================
# Auth Service Route
# =========================================================
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**


# =========================================================
# Employee Service Route
# =========================================================
spring.cloud.gateway.routes[1].id=employee-service
spring.cloud.gateway.routes[1].uri=lb://EMPLOYEE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/employees/**


# =========================================================
# Department Service Route
# =========================================================
spring.cloud.gateway.routes[2].id=department-service
spring.cloud.gateway.routes[2].uri=lb://DEPARTMENT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/departments/**


# =========================================================
# Attendance Service Route
# =========================================================
spring.cloud.gateway.routes[3].id=attendance-service
spring.cloud.gateway.routes[3].uri=lb://ATTENDANCE-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/attendance/**


# =========================================================
# Eureka Client
# =========================================================
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=localhost:8080
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# =========================================================
# Actuator
# =========================================================
management.endpoints.web.exposure.include=health,info,gateway


# =========================================================
# JWT Secret
# =========================================================
jwt.secret=hrms-project-secret-key-which-should-be-at-least-32-characters-long


# =========================================================
# Employee Swagger API Docs
# =========================================================
spring.cloud.gateway.routes[4].id=employee-service-swagger
spring.cloud.gateway.routes[4].uri=lb://EMPLOYEE-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/employee-service/v3/api-docs/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/employee-service/v3/api-docs/(?<segment>.*), /v3/api-docs/${segment}


# =========================================================
# Employee Swagger UI
# =========================================================
spring.cloud.gateway.routes[5].id=employee-service-swagger-ui
spring.cloud.gateway.routes[5].uri=lb://EMPLOYEE-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/employee-service/swagger-ui/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/employee-service/swagger-ui/(?<segment>.*), /swagger-ui/${segment}


# =========================================================
# Employee Swagger HTML
# =========================================================
spring.cloud.gateway.routes[6].id=employee-service-swagger-ui-html
spring.cloud.gateway.routes[6].uri=lb://EMPLOYEE-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/employee-service/swagger-ui.html
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/employee-service/swagger-ui.html, /swagger-ui.html


# =========================================================
# Employee WebJars
# =========================================================
spring.cloud.gateway.routes[7].id=employee-service-webjars
spring.cloud.gateway.routes[7].uri=lb://EMPLOYEE-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/employee-service/webjars/**
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/employee-service/webjars/(?<segment>.*), /webjars/${segment}


# =========================================================
# Root Swagger Config Route
# =========================================================
spring.cloud.gateway.routes[8].id=employee-service-swagger-config
spring.cloud.gateway.routes[8].uri=lb://EMPLOYEE-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/v3/api-docs/**
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/v3/api-docs/(?<segment>.*), /v3/api-docs/${segment}