spring.application.name=auth-service

# Server
server.port=8081

# MySQL Database - Docker
spring.datasource.url=jdbc:mysql://mysql:3306/hrms_auth_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=false

logging.level.org.springframework.security=DEBUG
spring.jpa.open-in-view=false

# JWT
jwt.secret=hrms-project-secret-key-which-should-be-at-least-32-characters-long
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Eureka - Docker
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Eureka instance - accessible from local Gateway
eureka.instance.hostname=auth-service
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=auth-service:8081