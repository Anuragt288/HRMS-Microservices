spring.application.name=employee-service

server.port=8082

spring.datasource.url=jdbc:mysql://mysql:3306/hrms_employee_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=hrms-project-secret-key-which-should-be-at-least-32-characters-long

eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=employee-service
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=employee-service:8082